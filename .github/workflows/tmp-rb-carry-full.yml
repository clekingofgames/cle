name: Temporary RB carry census
on:
  push:
    branches:
      - tmp/rb-carry-2023-2025-analysis
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip pandas pyarrow numpy scipy requests
      - name: Apply audited source compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tmp_rb_analysis/rb_carry_full_2023_2025.py')
          s=p.read_text()
          fixes=[
            ("'books':json.dumps(d.book_id.value_counts().head(10).to_dict())", "'books':str({int(k):int(v) for k,v in d.book_id.value_counts().head(10).items()})"),
            ("p=p[~p.get('_drop_period',False).fillna(False)].copy()", "p=p[p['period'].eq('event')].copy()"),
            ("c=canon.merge(st,left_on=['season','week','pid_str'],right_on=['season','week','stat_pid'],how='left')", "c=canon.merge(st,left_on=['season','week','pid_str'],right_on=['season','week','stat_pid'],how='left'); c['name_norm']=c['name_norm_x'] if 'name_norm_x' in c.columns else c['name_norm']"),
            ("pos=y.position_group.fillna(y.position).astype(str).str.upper()\ny=y[pos.eq('RB')].copy()", "pos=y.position.astype(str).str.upper()\ny=y[pos.eq('RB')].copy()")
          ]
          for old,new in fixes:
              if old in s: s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Run full census
        run: python tmp_rb_analysis/rb_carry_full_2023_2025.py
      - name: Package outputs
        if: always()
        run: |
          if [ -d rb_carry_2023_2025_full ]; then zip -r rb_carry_2023_2025_full.zip rb_carry_2023_2025_full; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb-carry-2023-2025-full
          path: |
            rb_carry_2023_2025_full
            rb_carry_2023_2025_full.zip
          if-no-files-found: warn
